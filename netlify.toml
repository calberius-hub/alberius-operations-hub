[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Short links for the punch-out tools
[[redirects]]
  from = "/punch"
  to = "/punchlist.html"
  status = 200

# CRA — Bid My Job sign maker
[[redirects]]
  from = "/sign"
  to = "/sign.html"
  status = 200

# CRA — subcontractor & vendor library
[[redirects]]
  from = "/subs"
  to = "/subs.html"
  status = 200

[[redirects]]
  from = "/punch-dashboard"
  to = "/punch-dashboard.html"
  status = 200
